# ---------------------------------------------------------------------------
# RADAR DE REPOS — configuración
#
# Este es el único archivo que necesitas tocar para cambiar QUÉ busca el radar.
# Puedes añadir, quitar o reescribir queries sin tocar nada de código.
#
# Cada eje puede sobrescribir min_stars, max_age_months y max_idle_days.
# Eso importa: la tecnología cívica y electoral es un nicho pequeño y lento,
# mientras que agentes y LLM está saturado. Con un solo umbral para todos,
# uno inunda el ranking y el otro sale vacío.
# ---------------------------------------------------------------------------

settings:
  # Valores por defecto; cada eje puede ajustarlos hacia arriba o abajo
  min_stars: 50
  max_age_months: 18
  max_idle_days: 60
  # Cuántos resultados traer por query (máx. 100)
  per_query_limit: 50
  # Segundos de espera entre queries. La API permite 30 búsquedas/minuto
  # autenticado; 2.5s deja margen de sobra.
  sleep_between_queries: 2.5
  # Cuántos repos mostrar en el dashboard
  dashboard_top_n: 150
  # Cupos reservados para cada eje antes de repartir el resto por score.
  # Evita que un eje con mucho volumen sepulte a los demás.
  per_axis_quota: 25

# Pesos del ranking final. Deben sumar 1.0
weights:
  momentum: 0.50
  maturity: 0.35
  relevance: 0.15

# Términos que suman relevancia en CUALQUIER eje (tu contexto particular)
boosts:
  - spanish
  - español
  - espanol
  - latam
  - latin america
  - latinoamerica
  - colombia
  - multilingual
  - electoral
  - political

# Términos que restan: normalmente indican recurso de estudio, no librería
# usable. No excluyen el repo, lo penalizan y lo marcan como "recurso".
penalties:
  - awesome
  - tutorial
  - curso
  - course
  - roadmap
  - interview
  - cheatsheet
  - cheat-sheet
  - handbook
  - study notes
  - learning path
  - examples collection
  - boilerplate collection

